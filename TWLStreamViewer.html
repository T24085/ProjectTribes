<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TWL Multi-Game Stream Viewer | TeamWarfare.net</title>

  <!-- Tailwind (remains same CDN for convenience) -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.10/dist/tailwind.min.css" rel="stylesheet">
  
  <!-- OAuth script - must load before page scripts -->
  <script src="oauth.js"></script>

  <!-- Custom fonts (system fallback otherwise) -->
  <style>
    :root{
      /* TWL Theme Colors - Dark red/maroon, black, greys with yellow and light blue accents */
      --twl-maroon: #330000;
      --twl-dark-red: #4d0000;
      --twl-black: #000000;
      --twl-dark-grey: #1a1a1a;
      --twl-grey: #2d2d2d;
      --twl-light-grey: #4a4a4a;
      --twl-yellow: #ffd700;
      --twl-light-blue: #87ceeb;
      --twl-red-accent: #cc3333;
      
      --bg-1: var(--twl-maroon);
      --bg-2: var(--twl-dark-red);
      --glass: rgba(0,0,0,0.4);
      --glass-strong: rgba(0,0,0,0.6);
      --accent: linear-gradient(90deg, var(--twl-red-accent), #ff4444);
      --card-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.05) inset;
      --glass-border: rgba(255,255,255,0.1);
      --glass-highlight: rgba(255,255,255,0.05);
      --muted: #999999;
      
      /* TWL specific accents */
      --twl-yellow-glow: rgba(255,215,0,0.3);
      --twl-blue-glow: rgba(135,206,235,0.3);
    }

    html,body{height:100%}
    body{
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:
        radial-gradient(800px 400px at 20% 20%, rgba(204,51,51,0.15), transparent 25%),
        radial-gradient(800px 400px at 80% 30%, rgba(135,206,235,0.1), transparent 30%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
      color:#ffffff;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding-bottom:6rem;
      min-height: 100vh;
    }

    /* Header handled by nav */

    /* Main layout */
    .container {
      max-width:1200px;
      margin: 1.25rem auto;
      padding: 0 1rem;
    }
    .glass {
      background: linear-gradient(180deg, rgba(0,0,0,0.5), rgba(26,26,26,0.7));
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 1rem;
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(10px) saturate(120%);
    }

    /* Filters & stats area */
    .filters .select, .filters .input {
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      outline: none;
      color: #ffffff;
    }
    .filters .select:focus, .filters .input:focus {
      border-color: var(--twl-red-accent);
      box-shadow: 0 0 8px rgba(204,51,51,0.3);
    }
    label.small { font-size: 0.72rem; color: var(--muted); letter-spacing:0.08em; text-transform:uppercase }

    /* Stream grid */
    #stream-grid {
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:1.25rem;
      margin-top:1rem;
    }
    @media (max-width:1100px){ #stream-grid{grid-template-columns:repeat(2,1fr)} }
    @media (max-width:640px){ #stream-grid{grid-template-columns:1fr} }

    .stream-card{
      border-radius:8px;
      overflow:hidden;
      position:relative;
      transition: transform .22s cubic-bezier(.2,.9,.2,1), box-shadow .22s;
      border: 1px solid rgba(255,255,255,0.1);
      background: linear-gradient(180deg, rgba(0,0,0,0.6), rgba(26,26,26,0.8));
    }

    .stream-card:hover{
      transform: translateY(-8px);
      box-shadow: 0 24px 60px rgba(0,0,0,0.8), 0 0 36px rgba(204,51,51,0.2);
      border-color: var(--twl-red-accent);
    }

    .stream-media{
      position:relative;
      aspect-ratio:16/9;
      background:#000;
      overflow:hidden;
      display:block;
    }
    .stream-overlay {
      position:absolute; inset:0; pointer-events:none;
      background: linear-gradient(180deg, rgba(0,0,0,0.0), rgba(0,0,0,0.25));
    }

    .live-pill{
      display:inline-flex; align-items:center; gap:0.5rem; padding:6px 10px; border-radius:999px;
      font-weight:700; font-size:0.75rem; text-transform:uppercase;
      background: linear-gradient(90deg, var(--twl-red-accent), #ff6666);
      color:white; box-shadow: 0 6px 20px rgba(204,51,51,0.4);
    }
    .neon-game{
      padding:6px 10px; border-radius:999px; font-weight:700; font-size:0.72rem;
      background: linear-gradient(90deg, rgba(135,206,235,0.2), rgba(135,206,235,0.15));
      color: var(--twl-light-blue); border: 1px solid rgba(135,206,235,0.3);
      backdrop-filter: blur(6px);
    }

    .meta { padding: 1rem; }
    .display-name { font-weight:700; font-size:1.02rem; }
    .handle { color:var(--muted); font-size:0.78rem; letter-spacing:0.08em; text-transform:uppercase; margin-top:0.2rem }
    .title { color: #cbd5e1; margin-top:0.6rem; font-size:0.92rem; line-height:1.35; min-height:2.5rem; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; }

    .card-actions { display:flex; gap:0.65rem; margin-top:0.9rem; }
    .btn-pill{
      flex:1 1 0; text-align:center; padding:8px 12px; border-radius:999px; font-weight:700; text-transform:uppercase; font-size:0.78rem;
    }
    .btn-chat { background: rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.2); color: #ffffff; }
    .btn-chat:hover { background: rgba(0,0,0,0.6); border-color: var(--twl-light-blue); }
    .btn-watch { background: var(--accent); color:#ffffff; border:none; box-shadow: 0 8px 30px rgba(204,51,51,0.3); }
    .btn-watch:hover { background: linear-gradient(90deg, #ff4444, #ff6666); box-shadow: 0 8px 30px rgba(204,51,51,0.5); }

    /* Left column / right chat layout on wide screens */
    main.layout {
      display:grid;
      grid-template-columns: 1fr 320px;
      gap:1rem;
      align-items:start;
    }
    @media (max-width:1024px){ main.layout{grid-template-columns: 1fr} }

    /* Chat panel */
    aside#chat-panel{
      position:sticky; top:6rem; height:calc(100vh - 6rem);
      border-radius:12px; overflow:hidden; display:flex; flex-direction:column;
      border: 1px solid rgba(255,255,255,0.03);
    }
    aside header{ padding:0.9rem 1rem; display:flex; align-items:center; justify-content:space-between; background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00)) }
    aside .embed { flex:1; border-top:1px solid rgba(255,255,255,0.02); background: #000 }

    /* Modal backdrop */
    .modal-backdrop { 
      backdrop-filter: blur(8px); 
      background: linear-gradient(180deg, rgba(51,0,0,0.85), rgba(26,0,0,0.9)); 
    }
    #admin-modal.hidden,
    #admin-login-modal.hidden {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
    #admin-modal:not(.hidden),
    #admin-login-modal:not(.hidden) {
      display: flex !important;
      visibility: visible !important;
      opacity: 1 !important;
      pointer-events: auto !important;
    }
    
    #admin-login-modal .glass {
      background: linear-gradient(180deg, rgba(0,0,0,0.9), rgba(26,26,26,0.95));
      border: 2px solid rgba(204,51,51,0.4);
      box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(204,51,51,0.2);
    }

    /* small helpers */
    .muted { color:var(--muted) }
    .stat {
      background: linear-gradient(180deg, rgba(0,0,0,0.4), rgba(26,26,26,0.6));
      border: 1px solid rgba(255,255,255,0.1);
      border-radius:8px; padding:0.75rem 1rem; display:flex; align-items:center; gap:0.75rem;
    }
    .stat .num { font-weight:800; color: var(--twl-light-blue); font-size:1.25rem }
    .faint { color: rgba(255,255,255,0.4) }

    /* toast */
    #toast{ 
      transition: all .28s; 
      transform:translateY(20px); 
      opacity:0;
      background: rgba(0,0,0,0.9) !important;
      border: 1px solid rgba(204,51,51,0.4) !important;
    }
    #toast.show{ transform:translateY(0); opacity:1; }

    /* small animated glow */
    @keyframes subtleGlow {
      0%{ box-shadow: 0 0 0 rgba(204,51,51,0.2) }
      50%{ box-shadow: 0 0 30px rgba(204,51,51,0.4) }
      100%{ box-shadow: 0 0 0 rgba(204,51,51,0.2) }
    }
    .glow { animation: subtleGlow 3.6s infinite; }
    
    /* TWL Theme adjustments */
    .muted { color: #999999; }
    #admin-modal {
      z-index: 9999;
    }
    #admin-modal .glass {
      background: linear-gradient(180deg, rgba(0,0,0,0.85), rgba(26,26,26,0.9));
      border: 2px solid rgba(204,51,51,0.3);
    }
    #admin-modal button[type="submit"],
    #admin-modal .btn-pill[style*="background:linear-gradient"] {
      background: linear-gradient(90deg, var(--twl-red-accent), #ff4444) !important;
      color: #ffffff !important;
      border: none;
    }
    
    /* Edit and Delete buttons in lists */
    #teams-list button, #streamers-list button {
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.2);
      color: #ffffff;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    #teams-list button:hover, #streamers-list button:hover {
      background: rgba(0,0,0,0.8);
      border-color: var(--twl-light-blue);
    }
    #teams-list button:last-child, #streamers-list button:last-child {
      border-color: rgba(204,51,51,0.5);
    }
    #teams-list button:last-child:hover, #streamers-list button:last-child:hover {
      border-color: var(--twl-red-accent);
      background: rgba(204,51,51,0.2);
    }
    
    /* Status badges using TWL colors */
    .text-green-300 { color: #4ade80 !important; }
    .text-indigo-300 { color: var(--twl-light-blue) !important; }

  </style>
</head>
<body>

  <!-- Navigation loaded via JS -->
  <div id="nav-container"></div>
  
  <script>
    // Load nav HTML
    fetch('TWLStreamViewer-nav.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('nav-container').innerHTML = html;
        // Re-run nav scripts after loading
        const scripts = document.getElementById('nav-container').querySelectorAll('script');
        scripts.forEach(oldScript => {
          const newScript = document.createElement('script');
          Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
          newScript.textContent = oldScript.textContent;
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });
      })
      .catch(err => console.error('Failed to load nav:', err));
  </script>

  <!-- Page content container -->
  <main class="container">

    <!-- Top filters + stats row -->
    <section class="glass flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div class="w-full md:w-2/3 grid grid-cols-1 sm:grid-cols-3 gap-3 filters">
        <div>
          <label class="small">Filter by Game</label>
          <select id="game-filter" class="select w-full px-3 py-2 rounded-md"></select>
        </div>
        <div>
          <label class="small">Filter by Team</label>
          <select id="team-filter" class="select w-full px-3 py-2 rounded-md"></select>
        </div>
        <div class="flex items-end gap-3">
          <div>
            <label class="small">Show Only Live</label>
            <div class="flex items-center gap-2 mt-1">
              <input id="live-only-toggle" type="checkbox" class="h-5 w-5 rounded border-slate-600" />
              <span class="muted text-sm">Live only</span>
            </div>
          </div>
        </div>
      </div>

      <div class="w-full md:w-1/3 flex items-center gap-3 justify-end">
        <div class="stat">
          <div class="faint text-xs">Total</div>
          <div class="num" id="stat-total">0</div>
        </div>
        <div class="stat">
          <div class="faint text-xs">Live</div>
          <div class="num" id="stat-live">0</div>
        </div>
        <div class="stat">
          <div class="faint text-xs">Games</div>
          <div class="num" id="stat-games">0</div>
        </div>
      </div>
    </section>

    <!-- Main layout: stream grid + chat (right column) -->
    <div class="layout mt-4">

      <!-- Left: Stream Grid -->
      <section>
        <div id="stream-grid">
          <!-- stream cards inserted here -->
        </div>

        <div id="empty-state" class="glass text-center py-10 hidden mt-6">
          <div class="text-slate-400">No streams to display. Add streamers or adjust filters.</div>
        </div>
      </section>

      <!-- Right: Chat Panel -->
      <aside id="chat-panel" class="glass hidden lg:flex flex-col">
        <header>
          <div class="text-sm font-semibold uppercase muted">Twitch Chat</div>
          <button id="close-chat" class="text-slate-300 hover:text-white">✕</button>
        </header>

        <div class="p-3">
          <select id="chat-select" class="w-full px-3 py-2 rounded-md select">
            <option value="">Select Channel</option>
          </select>
        </div>

        <div class="embed">
          <iframe id="chat-iframe" src="about:blank" class="w-full h-full" frameborder="0"></iframe>
        </div>
      </aside>

    </div>

  </main>

  <!-- Floating mobile chat button -->
  <button id="chat-toggle-mobile" class="lg:hidden fixed right-5 bottom-6 rounded-full w-14 h-14 flex items-center justify-center text-xl shadow-2xl" style="background: linear-gradient(135deg, var(--twl-red-accent), #ff4444); color: white;">
    💬
  </button>

  <!-- Admin Login Modal -->
  <div id="admin-login-modal" class="fixed inset-0 z-50 hidden modal-backdrop flex items-center justify-center p-4">
    <div class="w-full max-w-md glass rounded-xl p-6 space-y-4">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-2xl font-bold">Admin Login</h2>
        <button id="close-login-modal" class="text-2xl text-slate-300 hover:text-white">×</button>
      </div>
      <form id="admin-login-form" class="space-y-4">
        <div>
          <label class="text-sm muted block mb-2">Email</label>
          <input type="email" id="login-email" class="w-full px-3 py-2 rounded-md input" required autocomplete="email" placeholder="admin@example.com" />
        </div>
        <div>
          <label class="text-sm muted block mb-2">Password</label>
          <input type="password" id="login-password" class="w-full px-3 py-2 rounded-md input" required autocomplete="current-password" placeholder="Enter password" />
        </div>
        <div id="login-error" class="text-red-400 text-sm hidden"></div>
        <div class="flex gap-3 pt-2">
          <button type="submit" class="flex-1 px-4 py-2 rounded-md btn-pill" style="background:linear-gradient(90deg,var(--twl-red-accent),#ff4444); color:#ffffff">Sign In</button>
          <button type="button" id="cancel-login" class="px-4 py-2 rounded-md btn-pill text-sm" style="background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.2); color:#ffffff">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Consolidated Admin Panel Modal (Hidden by default) -->
  <div id="admin-modal" class="fixed inset-0 z-50 hidden modal-backdrop flex items-center justify-center p-4">
    <div class="w-full max-w-5xl glass overflow-y-auto rounded-xl max-h-[90vh]">
      <div class="sticky top-0 bg-transparent p-4 flex items-center justify-between border-b border-white/2 z-10">
        <h2 class="text-2xl font-bold">Admin Panel</h2>
        <button id="close-admin-modal" class="text-2xl text-slate-300 hover:text-white">×</button>
      </div>
      
      <div class="p-6 space-y-6">
        <!-- Manage Teams Section -->
        <section class="glass p-4 rounded-lg">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-semibold">Manage Teams</h3>
            <button id="toggle-teams-section" class="text-slate-300 hover:text-white text-xl">×</button>
          </div>
          <div id="teams-section-content">
            <form id="team-form" class="space-y-4 mb-6">
              <input type="hidden" id="team-id" />
              <div>
                <label class="text-sm muted">Team Name</label>
                <input id="team-name" class="w-full px-3 py-2 rounded-md input" required />
              </div>
              <div>
                <label class="text-sm muted">Team Logo URL</label>
                <input id="team-logo" class="w-full px-3 py-2 rounded-md input" placeholder="https://..." />
              </div>
              <div>
                <label class="text-sm muted">Games (comma-separated)</label>
                <input id="team-games" class="w-full px-3 py-2 rounded-md input" placeholder="Battlefield, Tribes: Ascend" />
              </div>
              <div class="flex gap-3">
                <button type="submit" class="px-4 py-2 rounded-md btn-pill" style="background:linear-gradient(90deg,var(--twl-red-accent),#ff4444); color:#ffffff">Save</button>
                <button type="button" id="cancel-team-edit" class="px-4 py-2 rounded-md btn-pill text-sm hidden" style="background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.2); color:#ffffff">Cancel</button>
              </div>
            </form>
            <div id="teams-list" class="space-y-3">
              <!-- teams listed here -->
            </div>
          </div>
        </section>

        <!-- Add Streamer Section -->
        <section class="glass p-4 rounded-lg">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-semibold">Add Streamer</h3>
            <button id="toggle-streamers-section" class="text-slate-300 hover:text-white text-xl">×</button>
          </div>
          <div id="streamers-section-content">
            <form id="streamer-form" class="space-y-4 mb-6">
              <input type="hidden" id="streamer-id" />
              <div>
                <label class="text-sm muted">Display Name</label>
                <input id="streamer-name" class="w-full px-3 py-2 rounded-md input" required />
              </div>
              <div>
                <label class="text-sm muted">Twitch Handle</label>
                <input id="streamer-twitch" class="w-full px-3 py-2 rounded-md input" placeholder="username" required />
                <div class="text-xs muted mt-1">Update this to fix stream detection</div>
              </div>
              <div>
                <label class="text-sm muted">Team</label>
                <select id="streamer-team" class="w-full px-3 py-2 rounded-md select">
                  <option value="">No Team</option>
                </select>
              </div>
              <div>
                <label class="text-sm muted">Default Game (optional)</label>
                <input id="streamer-game" class="w-full px-3 py-2 rounded-md input" placeholder="Battlefield" />
              </div>
              <div class="flex gap-3">
                <button type="submit" class="px-4 py-2 rounded-md btn-pill" style="background:linear-gradient(90deg,var(--twl-red-accent),#ff4444); color:#ffffff">Save</button>
                <button type="button" id="cancel-streamer-edit" class="px-4 py-2 rounded-md btn-pill text-sm hidden" style="background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.2); color:#ffffff">Cancel</button>
              </div>
            </form>
            <div id="streamers-list" class="space-y-3">
              <!-- streamers listed here -->
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed left-1/2 transform -translate-x-1/2 bottom-6 bg-slate-900 border border-white/6 px-6 py-3 rounded-md z-50">
    <p id="toast-message" class="text-sm muted"></p>
  </div>

    // ---------- Admin check ----------
    function checkAdmin(user){
      if(!user || !user.uid){ 
        state.isAdmin=false; 
        const adminBtn = document.getElementById('admin-panel-btn');
        const signInBtn = document.getElementById('admin-signin-btn');
        if(adminBtn) adminBtn.classList.add('hidden');
        if(signInBtn) signInBtn.classList.remove('hidden');
        return false;
      }
      state.isAdmin = ADMIN_UIDS.includes(user.uid);
      const adminBtn = document.getElementById('admin-panel-btn');
      const signInBtn = document.getElementById('admin-signin-btn');
      const twitchUser = document.getElementById('twitch-user');
      if(adminBtn) adminBtn.classList.toggle('hidden', !state.isAdmin);
      if(signInBtn) signInBtn.classList.toggle('hidden', state.isAdmin);
      if(state.isAdmin && twitchUser){
        twitchUser.textContent = `Admin: ${user.email || user.displayName || 'Logged in'}`;
        twitchUser.style.display = 'inline';
      }
      // If user is signed in but not admin, sign them out
      if(user && !state.isAdmin){
        signOut(auth).catch(err => console.error('Sign out error:', err));
      }
      // Set up admin button after admin check
      if(state.isAdmin){
        setTimeout(setupAdminButton, 100);
      }
      return state.isAdmin;
    }

    async function handleAdminLogin(e){
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const errorEl = document.getElementById('login-error');
      
      if(!email || !password){
        errorEl.textContent = 'Please enter both email and password';
        errorEl.classList.remove('hidden');
        return;
      }
      
      errorEl.classList.add('hidden');
      
      try{
        const result = await signInWithEmailAndPassword(auth, email, password);
        checkAdmin(result.user);
        if(state.isAdmin){
          showToast('Signed in as admin');
          els.adminLoginModal.classList.add('hidden');
          els.adminLoginForm.reset();
          errorEl.classList.add('hidden');
        } else {
          errorEl.textContent = 'Access denied - not an admin account';
          errorEl.classList.remove('hidden');
          await signOut(auth);
        }
      }catch(err){ 
        console.error('Firebase Admin Sign-In Error:', err);
        let errorMsg = err.message || 'Unknown error';
        if(err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password'){
          errorMsg = 'Invalid email or password';
        } else if(err.code === 'auth/too-many-requests'){
          errorMsg = 'Too many failed attempts. Please try again later.';
        } else if(err.code === 'auth/network-request-failed'){
          errorMsg = 'Network error. Please check your connection.';
        }
        errorEl.textContent = errorMsg;
        errorEl.classList.remove('hidden');
        showToast(`Admin sign-in failed: ${errorMsg}`);
      }
    }

    // ---------- Twitch API (live check) ----------
    async function fetchLiveStreams(){
      if(!window.twitchOAuth || !window.twitchOAuth.getToken()){
        state.liveStreams.clear();
        renderStreamGrid();
        return;
      }
      try{
        const allHandles = Array.from(state.streamers.values()).map(s=>s.twitchHandle).filter(Boolean);
        if(allHandles.length===0) return;
        const batches = [];
        for(let i=0;i<allHandles.length;i+=100) batches.push(allHandles.slice(i,i+100));
        const allStreams=[];
        for(const batch of batches){
          const query = batch.map(h=>`user_login=${encodeURIComponent(h)}`).join('&');
          const res = await fetch(`https://api.twitch.tv/helix/streams?${query}`, {
            headers: {
              'Client-ID': 'meabi1n42pccff5rz9ujpno7ky9vlt',
              'Authorization': `Bearer ${window.twitchOAuth.getToken()}`
            }
          });
          if(res.ok){
            const json = await res.json();
            if(json.data) allStreams.push(...json.data);
          }
        }
        state.liveStreams.clear();
        allStreams.forEach(stream=>{
          const handle = normalizeChannel(stream.user_login);
          state.liveStreams.set(handle, {
            user_login: handle,
            user_name: stream.user_name,
            game_name: stream.game_name || 'Just Chatting',
            viewer_count: stream.viewer_count || 0,
            title: stream.title || '',
            is_live: true
          });
        });
        renderStreamGrid(); updateStats();
      }catch(err){ console.error(err); }
    }

    // ---------- Rendering ----------
    function getVisibleStreamers(){
      let streamers = Array.from(state.streamers.values());
      if(state.filters.team) streamers = streamers.filter(s=>s.teamId === state.filters.team);
      if(state.filters.game) {
        streamers = streamers.filter(s=>{
          const live = state.liveStreams.get(s.twitchHandle);
          if(live) return live.game_name === state.filters.game;
          if(!live && s.defaultGame === state.filters.game) return true;
          return false;
        });
      }
      if(state.filters.liveOnly) streamers = streamers.filter(s => state.liveStreams.has(s.twitchHandle));

      // sort live first then alpha
      streamers.sort((a,b)=>{
        const aLive = state.liveStreams.has(a.twitchHandle);
        const bLive = state.liveStreams.has(b.twitchHandle);
        if(aLive === bLive) return a.displayName.localeCompare(b.displayName);
        return aLive ? -1 : 1;
      });
      return streamers;
    }

          }
        });
      }
      const signInBtn = document.getElementById('admin-signin-btn');
      if(signInBtn && !signInBtn.hasAttribute('data-listener')){
        signInBtn.setAttribute('data-listener', 'true');
        signInBtn.addEventListener('click', signInAsAdmin);
      }
      
      // Add logout functionality
      let logoutBtn = document.getElementById('admin-logout-btn');
      if(!logoutBtn){
        logoutBtn = document.createElement('button');
        logoutBtn.textContent = 'Logout';
        logoutBtn.className = 'btn btn-secondary';
        logoutBtn.id = 'admin-logout-btn';
        logoutBtn.style.display = 'none';
        logoutBtn.addEventListener('click', async () => {
          try {
            await signOut(auth);
            showToast('Logged out');
          } catch(err) {
            console.error('Logout error:', err);
            showToast('Logout failed');
          }
        });
        // Insert logout button after sign in button or admin panel button
        const container = signInBtn?.parentNode || adminBtn?.parentNode;
        if(container){
          container.insertBefore(logoutBtn, signInBtn?.nextSibling || adminBtn?.nextSibling);
        }
      }
    }
    
    // Try to set up immediately, then retry if nav not loaded
    setupAdminButton();
    setTimeout(setupAdminButton, 500);
    setTimeout(setupAdminButton, 1500);
    setTimeout(setupAdminButton, 3000);

    // Twitch OAuth handling - update after nav loads
    function setupOAuth(){
      const twitchLoginBtn = document.getElementById('twitch-login-btn');
      const twitchUser = document.getElementById('twitch-user');
      const adminPanelBtn = document.getElementById('admin-panel-btn');
      const adminSignInBtn = document.getElementById('admin-signin-btn');
      
      if(!window.twitchOAuth){
        console.warn('twitchOAuth not available yet, retrying...');
        setTimeout(setupOAuth, 500);
        return;
      }
      
      // Override redirect to come back to this page
      const originalLogin = window.twitchOAuth.login;
      window.twitchOAuth.login = function(){
        const basePath = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/');
        const REDIRECT_URI = `${basePath}TWLStreamViewer.html`;
        const CLIENT_ID = 'meabi1n42pccff5rz9ujpno7ky9vlt';
        const scopes = 'user:read:email';
        const authUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${encodeURIComponent(scopes)}`;
        window.location.href = authUrl;
      };
      
      if(twitchLoginBtn){
        twitchLoginBtn.addEventListener('click', ()=> {
          if(window.twitchOAuth.getToken()){
            // Logout
            window.twitchOAuth.logout();
            if(twitchUser) twitchUser.style.display = 'none';
            twitchLoginBtn.textContent = 'Sign in with Twitch';
            state.liveStreams.clear();
            renderStreamGrid();
          } else {
            // Login
            window.twitchOAuth.login();
          }
        });
      }
      
      // Update UI based on token state
      function updateOAuthUI(){
        const token = window.twitchOAuth.getToken();
        if(token){
          twitchLoginBtn.textContent = 'Sign Out';
          window.twitchOAuth.fetchUser().then(user=>{
            if(user && twitchUser){
              twitchUser.textContent = `Signed in as ${user.display_name || user.login}`;
              twitchUser.style.display = 'inline';
            }
          }).catch(()=>{
            // Token might be invalid
            localStorage.removeItem('twitch_token');
            updateOAuthUI();
          });
        } else {
          if(twitchLoginBtn) twitchLoginBtn.textContent = 'Sign in with Twitch';
          if(twitchUser) twitchUser.style.display = 'none';
        }
        fetchLiveStreams();
      }
      
      // Check for OAuth redirect token
      if(window.location.hash.includes('access_token')){
        const params = new URLSearchParams(window.location.hash.slice(1));
        const token = params.get('access_token');
        if(token){
          localStorage.setItem('twitch_token', token);
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      }
      
      updateOAuthUI();
      
      // Update admin button visibility
      if(adminPanelBtn) adminPanelBtn.classList.toggle('hidden', !state.isAdmin);
      if(adminSignInBtn) adminSignInBtn.classList.toggle('hidden', state.isAdmin);
    }
    
    // Wait for both nav and oauth to be ready
    if(document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', ()=>{
        setTimeout(setupOAuth, 1000);
      });
    } else {
      setTimeout(setupOAuth, 1000);
    }

    // ---------- init ----------
    async function init(){
      // Set up auth state listener first to persist login
      onAuthStateChanged(auth, (user) => { 
        checkAdmin(user);
        // Update logout button visibility
        const logoutBtn = document.getElementById('admin-logout-btn');
        if(logoutBtn){
          logoutBtn.style.display = state.isAdmin ? 'inline-block' : 'none';
        }
      });

      await loadTeams();
      await loadStreamers();
      fetchLiveStreams();
      renderStreamersList();

      setInterval(fetchLiveStreams, 60000);

      onSnapshot(collection(db, COLLECTIONS.TEAMS), ()=>{ loadTeams(); if(els.adminModal && !els.adminModal.classList.contains('hidden')) renderTeamsList(); });
      onSnapshot(collection(db, COLLECTIONS.STREAMERS), ()=>{ loadStreamers(); if(els.adminModal && !els.adminModal.classList.contains('hidden')) renderStreamersList(); });
    }

    init();

  </script>
