<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TWL Multi-Game Stream Viewer | TeamWarfare.net</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.10/dist/tailwind.min.css">
  <script src="oauth.js"></script>
  <style>
    :root {
      --bg-color: #030712;
      --bg-gradient: radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.08), transparent 55%), 
                     radial-gradient(circle at 80% 30%, rgba(129, 140, 248, 0.12), transparent 60%), 
                     linear-gradient(220deg, rgba(15, 23, 42, 0.88), rgba(2, 6, 23, 0.94));
      --panel-bg: rgba(15, 23, 42, 0.82);
      --surface-glass: rgba(17, 24, 39, 0.65);
      --card-bg: rgba(13, 19, 33, 0.84);
      --text-primary: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #8b5cf6;
      --accent-strong: #38bdf8;
      --success: #22c55e;
      --danger: #f87171;
      --transition-snappy: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --shadow-xl: 0 32px 65px -25px rgba(46, 78, 155, 0.48);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg-gradient), var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    /* Header Styling */
    nav {
      background: rgba(8, 11, 26, 0.85) !important;
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
    }
    /* Game Badge Enhanced */
    .game-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: rgba(139, 92, 246, 0.25);
      border: 1px solid rgba(139, 92, 246, 0.5);
      color: #c4b5fd;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.2);
      backdrop-filter: blur(8px);
    }
    .game-badge.live {
      background: rgba(34, 197, 94, 0.25);
      border-color: rgba(34, 197, 94, 0.6);
      color: #bbf7d0;
      box-shadow: 0 4px 16px rgba(34, 197, 94, 0.3);
      animation: game-badge-glow 2s ease-in-out infinite;
    }
    @keyframes game-badge-glow {
      0%, 100% { box-shadow: 0 4px 16px rgba(34, 197, 94, 0.3); }
      50% { box-shadow: 0 4px 24px rgba(34, 197, 94, 0.5); }
    }
    /* Live Pulse Animation */
    .live-pulse {
      animation: pulse-strong 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
    }
    @keyframes pulse-strong {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }
    /* Stream Cards - Enhanced */
    .stream-card {
      background: var(--card-bg);
      border: 1px solid rgba(99, 102, 241, 0.28);
      border-radius: 1.25rem;
      overflow: hidden;
      position: relative;
      transition: all var(--transition-snappy);
      box-shadow: 0 24px 45px -30px rgba(59, 130, 246, 0.45);
      width: 100%;
      min-width: 0;
    }
    #stream-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }
    @media (max-width: 1280px) {
      main {
        padding-right: 1.5rem !important;
      }
    }
    @media (max-width: 1024px) {
      #stream-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      main {
        padding-right: 1.5rem !important;
      }
    }
    @media (max-width: 640px) {
      #stream-grid {
        grid-template-columns: 1fr;
      }
    }
    .stream-card::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.9), rgba(56, 189, 248, 0.9));
      opacity: 0;
      transition: opacity var(--transition-snappy);
      z-index: 0;
      pointer-events: none;
    }
    .stream-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 32px 70px -32px rgba(99, 102, 241, 0.6);
      border-color: rgba(129, 140, 248, 0.5);
    }
    .stream-card:hover::before {
      opacity: 0.15;
    }
    .stream-card.live {
      border-color: rgba(34, 197, 94, 0.4);
      box-shadow: 0 24px 50px -25px rgba(34, 197, 94, 0.35);
    }
    .stream-card.live::before {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.9), rgba(56, 189, 248, 0.9));
    }
    .stream-card > * {
      position: relative;
      z-index: 1;
    }
    /* Filter Panel Enhanced */
    .filter-panel {
      background: var(--surface-glass) !important;
      border: 1px solid rgba(148, 163, 184, 0.18) !important;
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 40px -28px rgba(15, 23, 42, 0.75);
    }
    /* Stats Enhanced */
    .stat-item {
      background: rgba(15, 23, 42, 0.58);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 1rem;
      padding: 0.75rem 1.25rem;
      backdrop-filter: blur(8px);
    }
    /* Modal Backdrop */
    .modal-backdrop {
      backdrop-filter: blur(8px);
      background: rgba(0, 0, 0, 0.75);
    }
    /* Buttons Enhanced */
    button, .btn {
      transition: all var(--transition-snappy);
    }
    button:hover, .btn:hover {
      transform: translateY(-1px);
    }
    /* Chat Panel Enhanced */
    #chat-panel {
      background: rgba(9, 13, 30, 0.95) !important;
      border: 1px solid rgba(129, 140, 248, 0.22);
      box-shadow: 0 24px 60px -20px rgba(99, 102, 241, 0.45);
      backdrop-filter: blur(16px);
    }
    /* Empty State */
    #empty-state {
      background: rgba(148, 163, 184, 0.08);
      border: 1px dashed rgba(148, 163, 184, 0.22);
      border-radius: 1.25rem;
      padding: 3rem;
    }
    /* Stream Iframe Container */
    .stream-container {
      position: relative;
      background: #000;
      border-radius: 0.75rem;
      overflow: hidden;
    }
    .stream-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    /* Live Badge Enhanced */
    .live-badge {
      background: rgba(239, 68, 68, 0.9) !important;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body class="font-sans">
  <!-- Header -->
  <nav class="sticky top-0 z-40 bg-slate-900/85 backdrop-blur-md border-b border-slate-700/50 px-6 py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between flex-wrap gap-4">
      <div class="flex items-center gap-3">
        <h1 class="text-2xl font-bold bg-gradient-to-r from-violet-400 to-cyan-400 bg-clip-text text-transparent">
          TWL Stream Viewer
        </h1>
        <span class="text-xs text-slate-400 uppercase tracking-wider">Multi-Game Hub</span>
      </div>
      <div class="flex items-center gap-3 flex-wrap">
        <button id="admin-panel-btn" class="px-4 py-2 rounded-lg bg-amber-600 hover:bg-amber-700 text-sm font-medium transition hidden">
          Admin Panel
        </button>
        <div id="auth-group" class="flex items-center gap-2">
          <span id="twitch-user" class="text-sm text-slate-400 hidden"></span>
          <button id="admin-signin-btn" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-sm font-medium transition hidden">
            Admin Sign In
          </button>
          <button id="twitch-login-btn" class="px-4 py-2 rounded-lg bg-[#9146ff] hover:bg-[#772ce8] text-sm font-medium transition">
            Sign in with Twitch
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Filters -->
  <section class="max-w-7xl mx-auto px-6 py-4">
    <div class="filter-panel rounded-xl p-4">
      <div class="flex flex-wrap items-center gap-4">
        <div class="flex-1 min-w-[200px]">
          <label class="block text-xs text-slate-400 mb-1 uppercase tracking-wider">Filter by Game</label>
          <select id="game-filter" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-violet-500">
            <option value="">All Games</option>
          </select>
        </div>
        <div class="flex-1 min-w-[200px]">
          <label class="block text-xs text-slate-400 mb-1 uppercase tracking-wider">Filter by Team</label>
          <select id="team-filter" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-violet-500">
            <option value="">All Teams</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <label class="block text-xs text-slate-400 mb-1 uppercase tracking-wider">Show Only Live</label>
          <input type="checkbox" id="live-only-toggle" class="w-5 h-5 rounded bg-slate-800 border-slate-700 text-violet-600 focus:ring-violet-500">
        </div>
      </div>
    </div>
  </section>

  <!-- Stats Banner -->
  <section class="max-w-7xl mx-auto px-6 py-4">
    <div class="flex flex-wrap gap-4">
      <div class="stat-item flex items-center gap-2">
        <span style="font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted);">Total Streamers</span>
        <strong id="stat-total" style="display: block; margin-left: 0.5rem; font-size: 1.55rem; font-weight: 700; color: var(--accent);">0</strong>
      </div>
      <div class="stat-item flex items-center gap-2">
        <span style="font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted);">Live Now</span>
        <strong id="stat-live" style="display: block; margin-left: 0.5rem; font-size: 1.55rem; font-weight: 700; color: var(--success);">0</strong>
      </div>
      <div class="stat-item flex items-center gap-2">
        <span style="font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted);">Games Active</span>
        <strong id="stat-games" style="display: block; margin-left: 0.5rem; font-size: 1.55rem; font-weight: 700; color: var(--accent-strong);">0</strong>
      </div>
    </div>
  </section>

  <!-- Stream Grid -->
  <main class="max-w-7xl mx-auto px-6 py-6" style="padding-right: 22rem;">
    <div id="stream-grid" class="grid gap-6">
      <!-- Streams will be inserted here -->
    </div>
    <div id="empty-state" class="text-center py-12 hidden">
      <p class="text-slate-400 text-lg">No streams to display. Add streamers or adjust filters.</p>
    </div>
  </main>

  <!-- Chat Panel (optional, hidden by default on mobile) -->
  <aside id="chat-panel" class="fixed right-4 top-24 w-80 bg-slate-900/95 backdrop-blur-md rounded-xl border border-slate-700/50 p-4 hidden lg:flex flex-col gap-3 z-30" style="height: calc(100vh - 8rem);">
    <div class="flex items-center justify-between">
      <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Twitch Chat</h3>
      <button id="close-chat" class="text-slate-400 hover:text-white">✕</button>
    </div>
    <select id="chat-select" class="px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-violet-500">
      <option value="">Select Channel</option>
    </select>
    <iframe id="chat-iframe" src="about:blank" class="flex-1 rounded-lg border border-slate-700" frameborder="0"></iframe>
  </aside>

  <!-- Chat Toggle Button (mobile) -->
  <button id="chat-toggle-mobile" class="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-violet-600 hover:bg-violet-700 shadow-lg lg:hidden z-40 flex items-center justify-center">
    <span class="text-2xl">💬</span>
  </button>

  <!-- Modals -->
  <!-- Team Management Modal -->
  <div id="team-modal" class="fixed inset-0 z-50 hidden modal-backdrop" onclick="if(event.target.id==='team-modal') this.classList.add('hidden')">
    <div class="flex items-center justify-center min-h-screen p-4">
      <div class="bg-slate-900 rounded-xl border border-slate-700 w-full max-w-2xl max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
        <div class="sticky top-0 bg-slate-900 border-b border-slate-700 p-6 flex items-center justify-between">
          <h2 class="text-2xl font-bold">Manage Teams</h2>
          <button id="close-team-modal" class="text-slate-400 hover:text-white text-2xl">×</button>
        </div>
        <div class="p-6">
          <form id="team-form" class="space-y-4 mb-6">
            <input type="hidden" id="team-id">
            <div>
              <label class="block text-sm font-medium mb-1">Team Name</label>
              <input type="text" id="team-name" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-violet-500" required>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Team Logo URL</label>
              <input type="url" id="team-logo" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-violet-500" placeholder="https://...">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Games (comma-separated)</label>
              <input type="text" id="team-games" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-violet-500" placeholder="Battlefield, Tribes: Ascend">
            </div>
            <div class="flex gap-2">
              <button type="submit" class="flex-1 px-4 py-2 bg-violet-600 hover:bg-violet-700 rounded-lg font-medium transition">
                Add Team
              </button>
              <button type="button" id="cancel-team-edit" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg font-medium transition hidden">
                Cancel
              </button>
            </div>
          </form>
          <div id="teams-list" class="space-y-3">
            <!-- Teams will be listed here -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Streamer Management Modal -->
  <div id="streamer-modal" class="fixed inset-0 z-50 hidden modal-backdrop" onclick="if(event.target.id==='streamer-modal') this.classList.add('hidden')">
    <div class="flex items-center justify-center min-h-screen p-4">
      <div class="bg-slate-900 rounded-xl border border-slate-700 w-full max-w-2xl max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
        <div class="sticky top-0 bg-slate-900 border-b border-slate-700 p-6 flex items-center justify-between">
          <h2 class="text-2xl font-bold">Add Streamer</h2>
          <button id="close-streamer-modal" class="text-slate-400 hover:text-white text-2xl">×</button>
        </div>
        <div class="p-6">
          <form id="streamer-form" class="space-y-4">
            <input type="hidden" id="streamer-id">
            <div>
              <label class="block text-sm font-medium mb-1">Display Name</label>
              <input type="text" id="streamer-name" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-violet-500" required>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Twitch Handle</label>
              <input type="text" id="streamer-twitch" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-violet-500" placeholder="username" required>
              <p class="text-xs text-slate-400 mt-1">Update this to fix stream detection</p>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Team</label>
              <select id="streamer-team" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-violet-500">
                <option value="">No Team</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Default Game (optional)</label>
              <input type="text" id="streamer-game" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-violet-500" placeholder="Battlefield">
            </div>
            <div class="flex gap-2">
              <button type="submit" class="flex-1 px-4 py-2 bg-violet-600 hover:bg-violet-700 rounded-lg font-medium transition">
                Add Streamer
              </button>
              <button type="button" id="cancel-streamer-edit" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg font-medium transition hidden">
                Cancel
              </button>
            </div>
          </form>
          <div id="streamers-list" class="mt-6 space-y-3">
            <!-- Streamers will be listed here -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 border border-slate-700 px-6 py-3 rounded-lg shadow-lg z-50">
    <p id="toast-message" class="text-sm"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      getDocs, 
      addDoc, 
      doc, 
      deleteDoc,
      updateDoc,
      query,
      where,
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Firebase Configuration (reuse existing)
    const firebaseConfig = {
      apiKey: "AIzaSyB_ksHlcP2P9cT5jbo2IAGxbQ4zgEODkyM",
      authDomain: "team-sign-up-b5646.firebaseapp.com",
      projectId: "team-sign-up-b5646",
      storageBucket: "team-sign-up-b5646.firebasestorage.app",
      messagingSenderId: "951471144681",
      appId: "1:951471144681:web:a2458675ce73ce9ad9ba78"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Admin UIDs from firestore.rules
    const ADMIN_UIDS = ['DkBHsCzLK5a9KiX50g0pHJrEqGq2', 'A2ZV8vziNsXqZkyqHzAB266B9pP2'];

    // Separate TWL collections
    const COLLECTIONS = {
      TEAMS: 'twl_teams',
      STREAMERS: 'twl_streamers'
    };

    // State
    const state = {
      teams: new Map(),
      streamers: new Map(),
      liveStreams: new Map(), // channel -> stream data
      filters: {
        game: '',
        team: '',
        liveOnly: false
      },
      currentChatChannel: '',
      isAdmin: false,
      editingTeam: null,
      editingStreamer: null
    };

    // DOM Elements
    const els = {
      streamGrid: document.getElementById('stream-grid'),
      emptyState: document.getElementById('empty-state'),
      gameFilter: document.getElementById('game-filter'),
      teamFilter: document.getElementById('team-filter'),
      liveOnlyToggle: document.getElementById('live-only-toggle'),
      adminPanelBtn: document.getElementById('admin-panel-btn'),
      adminSignInBtn: document.getElementById('admin-signin-btn'),
      twitchLoginBtn: document.getElementById('twitch-login-btn'),
      twitchUser: document.getElementById('twitch-user'),
      teamModal: document.getElementById('team-modal'),
      streamerModal: document.getElementById('streamer-modal'),
      teamForm: document.getElementById('team-form'),
      streamerForm: document.getElementById('streamer-form'),
      teamsList: document.getElementById('teams-list'),
      chatPanel: document.getElementById('chat-panel'),
      chatSelect: document.getElementById('chat-select'),
      chatIframe: document.getElementById('chat-iframe'),
      chatToggle: document.getElementById('chat-toggle-mobile'),
      closeChat: document.getElementById('close-chat'),
      stats: {
        total: document.getElementById('stat-total'),
        live: document.getElementById('stat-live'),
        games: document.getElementById('stat-games')
      }
    };

    // Utility Functions
    function normalizeChannel(channel) {
      return String(channel || '').trim().toLowerCase();
    }

    function showToast(message, duration = 3000) {
      const toast = document.getElementById('toast');
      const messageEl = document.getElementById('toast-message');
      messageEl.textContent = message;
      toast.style.opacity = '1';
      toast.style.transform = 'translate(-50%, 0)';
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translate(-50%, 20px)';
      }, duration);
    }

    function getParentHosts() {
      const hosts = [
        window.location.hostname,
        "www.tribesprofessionalleague.online",
        "tribesprofessionalleague.online",
        "t24085.github.io",
        "localhost",
        "127.0.0.1"
      ].filter(Boolean);
      if (!hosts.length) hosts.push("www.tribesprofessionalleague.online");
      return hosts.map(h => `parent=${encodeURIComponent(h)}`).join('&');
    }

    const parentQuery = getParentHosts();

    // Admin Check
    function checkAdmin(user) {
      if (!user || !user.uid) {
        state.isAdmin = false;
        els.adminPanelBtn.classList.add('hidden');
        els.adminSignInBtn.classList.remove('hidden');
        return false;
      }
      state.isAdmin = ADMIN_UIDS.includes(user.uid);
      els.adminPanelBtn.classList.toggle('hidden', !state.isAdmin);
      els.adminSignInBtn.classList.toggle('hidden', state.isAdmin);
      if (state.isAdmin) {
        els.twitchUser.textContent = `Admin: ${user.email || user.displayName || 'Logged in'}`;
        els.twitchUser.classList.remove('hidden');
      }
      return state.isAdmin;
    }

    async function signInAsAdmin() {
      try {
        const provider = new GoogleAuthProvider();
        const result = await signInWithPopup(auth, provider);
        checkAdmin(result.user);
        showToast('Signed in as admin');
      } catch (err) {
        console.error('Admin sign-in failed:', err);
        showToast('Admin sign-in failed. Use Google account linked to admin UID.');
      }
    }

    // Firebase Operations
    async function loadTeams() {
      try {
        const snapshot = await getDocs(collection(db, COLLECTIONS.TEAMS));
        state.teams.clear();
        snapshot.forEach(doc => {
          state.teams.set(doc.id, { id: doc.id, ...doc.data() });
        });
        updateTeamFilter();
        updateStreamerFormTeams();
        renderTeamsList();
      } catch (err) {
        console.error('Error loading teams:', err);
        showToast('Failed to load teams');
      }
    }

    async function loadStreamers() {
      try {

    // Twitch API Integration
    async function fetchLiveStreams() {
      if (!window.twitchOAuth || !window.twitchOAuth.getToken()) {
        state.liveStreams.clear();
        renderStreamGrid();
        return;
      }

      try {
        const allHandles = Array.from(state.streamers.values()).map(s => s.twitchHandle).filter(Boolean);
        if (allHandles.length === 0) return;

        // Fetch in batches (Twitch API limit is 100 per request)
        const batches = [];
        for (let i = 0; i < allHandles.length; i += 100) {
          batches.push(allHandles.slice(i, i + 100));
        }

        const allStreams = [];
        for (const batch of batches) {
          const query = batch.map(h => `user_login=${encodeURIComponent(h)}`).join('&');
          const res = await fetch(`https://api.twitch.tv/helix/streams?${query}`, {
            headers: {
              'Client-ID': 'meabi1n42pccff5rz9ujpno7ky9vlt',
              'Authorization': `Bearer ${window.twitchOAuth.getToken()}`
            }
          });

          if (res.ok) {
            const json = await res.json();
            if (json.data) {
              allStreams.push(...json.data);
            }
          }
        }

        state.liveStreams.clear();
        allStreams.forEach(stream => {
          const handle = normalizeChannel(stream.user_login);
          state.liveStreams.set(handle, {
            user_login: handle,
            user_name: stream.user_name,
            game_name: stream.game_name || 'Just Chatting',
            viewer_count: stream.viewer_count || 0,
            title: stream.title || '',
            is_live: true
          });
        });

        renderStreamGrid();
        updateStats();
      } catch (err) {
        console.error('Error fetching live streams:', err);
      }
    }

    function getVisibleStreamers() {
      let streamers = Array.from(state.streamers.values());

      // Filter by team
      if (state.filters.team) {
        streamers = streamers.filter(s => s.teamId === state.filters.team);
      }

      // Filter by game - exact match like Twitch
      if (state.filters.game) {
        streamers = streamers.filter(s => {
          const handle = s.twitchHandle;
          const liveData = state.liveStreams.get(handle);
          // Only show streams that are live and playing the selected game
          if (liveData) {
            return liveData.game_name === state.filters.game;
          }
          // If offline but has default game matching, show it too
          if (!liveData && s.defaultGame === state.filters.game) {
            return true;
          }
          return false;
        });
      }

      // Filter by live only
      if (state.filters.liveOnly) {
        streamers = streamers.filter(s => state.liveStreams.has(s.twitchHandle));
      }

      // Sort: live first
      streamers.sort((a, b) => {
        const aLive = state.liveStreams.has(a.twitchHandle);
        const bLive = state.liveStreams.has(b.twitchHandle);
        if (aLive === bLive) return a.displayName.localeCompare(b.displayName);
        return aLive ? -1 : 1;
      });

      return streamers;
    }

      }

      Array.from(state.teams.values()).sort((a, b) => a.teamName.localeCompare(b.teamName)).forEach(team => {
        const div = document.createElement('div');
        div.className = 'bg-slate-800 rounded-lg p-3';
        div.innerHTML = `
          <h4 class="font-semibold text-sm">${escapeHtml(team.teamName)}</h4>
          ${team.games?.length ? `<p class="text-xs text-slate-400 mt-1">${team.games.join(', ')}</p>` : ''}
          <button onclick="editTeam('${team.id}'); document.getElementById('admin-modal').classList.add('hidden');" class="mt-2 w-full px-2 py-1 bg-violet-600 hover:bg-violet-700 rounded text-xs transition">
            Edit
          </button>
        `;
        listEl.appendChild(div);
      });
    }

    function renderAdminStreamersList() {
      const listEl = document.getElementById('admin-streamers-list');
      if (!listEl) return;
      listEl.innerHTML = '';
      
      if (state.streamers.size === 0) {
        listEl.innerHTML = '<p class="text-slate-400 text-sm">No streamers</p>';
        return;
      }

      Array.from(state.streamers.values()).sort((a, b) => a.displayName.localeCompare(b.displayName)).forEach(streamer => {
        const handle = streamer.twitchHandle;
        const liveData = state.liveStreams.get(handle);
        const team = streamer.teamId ? state.teams.get(streamer.teamId) : null;
        
        const div = document.createElement('div');
        div.className = 'bg-slate-800 rounded-lg p-3';
        div.innerHTML = `
          <h4 class="font-semibold text-sm">${escapeHtml(streamer.displayName)}</h4>
          <p class="text-xs text-slate-400 mt-1">@${escapeHtml(streamer.twitchHandle)}</p>
          ${team ? `<p class="text-xs text-violet-400 mt-1">${escapeHtml(team.teamName)}</p>` : ''}
          ${liveData ? `<p class="text-xs text-green-400 mt-1">● Live: ${escapeHtml(liveData.game_name)}</p>` : ''}
          <button onclick="editStreamer('${streamer.id}'); document.getElementById('admin-modal').classList.add('hidden');" class="mt-2 w-full px-2 py-1 bg-violet-600 hover:bg-violet-700 rounded text-xs transition">
            Edit
          </button>
        `;
        listEl.appendChild(div);
      });
    }

    els.chatToggle.addEventListener('click', () => {
      els.chatPanel.classList.toggle('hidden');
      if (!els.chatPanel.classList.contains('hidden')) {
        els.chatPanel.classList.add('fixed', 'inset-0', 'w-full', 'h-full', 'right-0', 'top-0');
      }
    });

    els.closeChat.addEventListener('click', () => {
      els.chatPanel.classList.add('hidden');
    });

    // Twitch Auth
    if (window.twitchOAuth) {
      els.twitchLoginBtn.addEventListener('click', () => {
        window.twitchOAuth.login();
      });

      // Check if already logged in
      if (window.twitchOAuth.getToken()) {
        window.twitchOAuth.fetchUser().then(user => {
          if (user) {
            els.twitchUser.textContent = user.display_name || user.login;
            els.twitchUser.classList.remove('hidden');
            els.twitchLoginBtn.textContent = 'Sign Out';
            els.twitchLoginBtn.onclick = () => {
              window.twitchOAuth.logout();
              els.twitchUser.classList.add('hidden');
              els.twitchLoginBtn.textContent = 'Sign in with Twitch';
              state.liveStreams.clear();
              renderStreamGrid();
            };
          }
        });
      }
    }

    // Initialize
    async function init() {
      // Check admin status on auth state change
      onAuthStateChanged(auth, (user) => {
        checkAdmin(user);
      });

      // Admin sign-in button
      els.adminSignInBtn.addEventListener('click', signInAsAdmin);

      await loadTeams();
      await loadStreamers();
      fetchLiveStreams();
      renderStreamersList();
      
      // Refresh live status every 60 seconds
      setInterval(fetchLiveStreams, 60000);
      
      // Set up real-time listeners
      onSnapshot(collection(db, COLLECTIONS.TEAMS), () => {
        loadTeams();
        if (document.getElementById('admin-modal') && !document.getElementById('admin-modal').classList.contains('hidden')) {
          renderAdminTeamsList();
        }
      });
      
      onSnapshot(collection(db, COLLECTIONS.STREAMERS), () => {
        loadStreamers();
        renderStreamersList();
        if (document.getElementById('admin-modal') && !document.getElementById('admin-modal').classList.contains('hidden')) {
          renderAdminStreamersList();
        }
      });
    }

    init();
  </script>
</body>
</html>
