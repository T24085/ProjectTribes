<!-- TWLStreamViewer-nav.html — Navbar for TWL Stream Viewer -->
<style>
  :root {
    --twl-maroon: #330000;
    --twl-dark-red: #4d0000;
    --twl-black: #000000;
    --twl-dark-grey: #1a1a1a;
    --twl-grey: #2d2d2d;
    --twl-light-grey: #4a4a4a;
    --twl-yellow: #ffd700;
    --twl-light-blue: #87ceeb;
    --twl-red-accent: #cc3333;
    --bg-color: var(--twl-dark-grey);
    --text-primary: #e2e8f0;
    --text-muted: #94a3b8;
    --accent: var(--twl-red-accent);
    --accent-strong: var(--twl-light-blue);
  }

  nav#twl-header {
    position: sticky;
    top: 0;
    z-index: 40;
    background: linear-gradient(180deg, rgba(51,0,0,0.95), rgba(26,26,26,0.98));
    border-bottom: 2px solid rgba(204,51,51,0.3);
    backdrop-filter: blur(16px);
    padding: 1rem 2rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }

  .header-container {
    max-width: 1440px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2rem;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .header-brand img {
    height: 46px;
    width: auto;
    border-radius: 0.75rem;
    background: rgba(26,26,26,0.8);
    padding: 0.35rem 0.5rem;
    border: 1px solid rgba(204,51,51,0.3);
  }

  .brand-title {
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0;
    color: var(--text-primary);
  }

  .brand-subtitle {
    font-size: 0.8rem;
    color: var(--text-muted);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    margin: 0;
  }

  .auth-buttons {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .btn {
    padding: 0.5rem 1rem;
    border-radius: 0.5rem;
    border: 1px solid rgba(148, 163, 184, 0.3);
    background: rgba(15, 23, 42, 0.6);
    color: var(--text-primary);
    text-decoration: none;
    font-weight: 500;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    font-size: 0.9rem;
  }

  .btn:hover {
    background: rgba(204,51,51,0.3);
    border-color: rgba(204,51,51,0.5);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(204,51,51,0.2);
  }

  .btn-primary {
    background: linear-gradient(90deg, var(--twl-red-accent), #ff4444);
    border: none;
    color: #ffffff;
    font-weight: 700;
    box-shadow: 0 4px 15px rgba(204,51,51,0.4);
  }
  .btn-primary:hover {
    background: linear-gradient(90deg, #ff4444, #ff6666);
    box-shadow: 0 6px 20px rgba(204,51,51,0.6);
  }

  .btn-secondary {
    background: rgba(26,26,26,0.8);
    border: 1px solid rgba(204,51,51,0.4);
    color: var(--text-primary);
  }
  .btn-secondary:hover {
    background: rgba(26,26,26,1);
    border-color: var(--twl-light-blue);
  }

  #twitch-user {
    color: var(--text-muted);
    font-size: 0.9rem;
    display: none;
  }

  /* Mobile responsive */
  @media (max-width: 768px) {
    nav#twl-header {
      padding: 0.75rem 1rem;
    }
    .header-container {
      flex-direction: column;
      gap: 0.75rem;
    }
    .auth-buttons {
      width: 100%;
      flex-direction: column;
    }
    .btn {
      width: 100%;
      text-align: center;
    }
  }
</style>

<nav id="twl-header">
  <div class="header-container">
    <div class="header-brand">
      <img src="Tribes Professional League.png" alt="Tribes Professional League logo" onerror="this.style.display='none'">
      <div>
        <h1 class="brand-title">TWL Stream Viewer</h1>
        <p class="brand-subtitle">Multi-Game Hub</p>
      </div>
    </div>
    <div class="auth-buttons">
      <span id="twitch-user"></span>
      <button id="chat-popup-btn" class="btn btn-secondary" style="display: none;">💬 Chat</button>
      <button id="twitch-login-btn" class="btn btn-primary">Sign in with Twitch</button>
      <button id="admin-panel-btn" class="btn btn-secondary hidden">Admin Panel</button>
      <button id="admin-signin-btn" class="btn btn-secondary hidden">Admin Sign In</button>
    </div>
  </div>
</nav>

<script>
  // This nav will be integrated with the main page's OAuth and admin logic
</script>
