<!-- TWLStreamViewer-nav.html — Navbar for TWL Stream Viewer -->
<style>
  :root {
    --twl-maroon: #330000;
    --twl-dark-red: #4d0000;
    --twl-black: #000000;
    --twl-dark-grey: #1a1a1a;
    --twl-grey: #2d2d2d;
    --twl-light-grey: #4a4a4a;
    --twl-yellow: #ffd700;
    --twl-light-blue: #87ceeb;
    --twl-red-accent: #cc3333;
    --bg-color: var(--twl-dark-grey);
    --text-primary: #e2e8f0;
    --text-muted: #94a3b8;
    --accent: var(--twl-red-accent);
    --accent-strong: var(--twl-light-blue);
  }

  nav#twl-header {
    position: sticky;
    top: 0;
    z-index: 40;
    background: linear-gradient(180deg, rgba(51,0,0,0.95), rgba(26,26,26,0.98));
    border-bottom: 2px solid rgba(204,51,51,0.3);
    backdrop-filter: blur(16px);
    padding: 1rem 2rem 1rem 1rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }

  .header-container {
    max-width: 1440px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2rem;
  }

  .hamburger-menu {
    position: relative;
    display: flex;
    align-items: center;
  }
  
  .hamburger-btn {
    background: rgba(26,26,26,0.8);
    border: 1px solid rgba(204,51,51,0.4);
    color: var(--text-primary);
    padding: 0.5rem 0.75rem;
    border-radius: 0.5rem;
    cursor: pointer;
    font-size: 1.25rem;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 2.5rem;
    height: 2.5rem;
  }
  
  .hamburger-btn:hover {
    background: rgba(204,51,51,0.3);
    border-color: rgba(204,51,51,0.6);
    transform: translateY(-1px);
  }
  
  .team-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 0.5rem;
    background: linear-gradient(180deg, rgba(26,0,0,0.98), rgba(13,0,0,0.99));
    border: 2px solid rgba(204,51,51,0.5);
    border-radius: 0.75rem;
    padding: 1rem;
    min-width: 300px;
    max-width: 500px;
    max-height: 600px;
    overflow-y: auto;
    z-index: 1000;
    box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 40px rgba(204,51,51,0.3);
    display: none;
  }
  
  .team-dropdown.show {
    display: block;
  }
  
  .team-dropdown-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    padding-bottom: 0.75rem;
    border-bottom: 2px solid rgba(204,51,51,0.4);
  }
  
  .team-dropdown-header h3 {
    margin: 0;
    color: var(--text-primary);
    font-size: 1.1rem;
    font-weight: 600;
  }
  
  .team-dropdown-close {
    background: rgba(204,51,51,0.2);
    border: 1px solid rgba(204,51,51,0.4);
    color: #ffffff;
    padding: 0.25rem 0.5rem;
    border-radius: 0.375rem;
    cursor: pointer;
    font-size: 1.25rem;
    line-height: 1;
  }
  
  .team-dropdown-close:hover {
    background: rgba(204,51,51,0.4);
  }
  
  .team-checkbox-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem;
    border-radius: 0.5rem;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 0.5rem;
  }
  
  .team-checkbox-item:hover {
    background: rgba(204,51,51,0.15);
  }
  
  .team-checkbox-item input[type="checkbox"] {
    width: 1.25rem;
    height: 1.25rem;
    cursor: pointer;
    accent-color: var(--twl-red-accent);
  }
  
  .team-checkbox-item img {
    width: 32px;
    height: 32px;
    object-fit: contain;
    border-radius: 0.375rem;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.3);
  }
  
  .team-checkbox-item .team-name {
    flex: 1;
    color: var(--text-primary);
    font-weight: 500;
    font-size: 0.9rem;
  }
  
  .team-checkbox-item .team-league {
    color: var(--text-muted);
    font-size: 0.75rem;
  }
  
  .team-dropdown-actions {
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 2px solid rgba(204,51,51,0.4);
    display: flex;
    gap: 0.5rem;
  }
  
  .team-dropdown-actions button {
    flex: 1;
    padding: 0.5rem;
    border-radius: 0.5rem;
    border: 1px solid rgba(204,51,51,0.4);
    background: rgba(26,26,26,0.8);
    color: var(--text-primary);
    cursor: pointer;
    font-weight: 500;
    transition: all 0.2s;
  }
  
  .team-dropdown-actions button:hover {
    background: rgba(204,51,51,0.3);
    border-color: rgba(204,51,51,0.6);
  }
  
  .team-dropdown-actions button.primary {
    background: linear-gradient(90deg, var(--twl-red-accent), #ff4444);
    border: none;
    color: #ffffff;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .header-brand a {
    display: inline-block;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }
  .header-brand a:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
  }
  .header-brand img {
    height: 46px;
    width: auto;
    border-radius: 0.75rem;
    background: rgba(26,26,26,0.8);
    padding: 0.35rem 0.5rem;
    border: 1px solid rgba(204,51,51,0.3);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .header-brand a:hover img {
    border-color: rgba(204,51,51,0.6);
    box-shadow: 0 4px 12px rgba(204,51,51,0.3);
  }

  .brand-title {
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0;
    color: var(--text-primary);
  }

  .brand-subtitle {
    font-size: 0.8rem;
    color: var(--text-muted);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    margin: 0;
  }

  .auth-buttons {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .btn {
    padding: 0.5rem 1rem;
    border-radius: 0.5rem;
    border: 1px solid rgba(148, 163, 184, 0.3);
    background: rgba(15, 23, 42, 0.6);
    color: var(--text-primary);
    text-decoration: none;
    font-weight: 500;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    font-size: 0.9rem;
  }

  .btn:hover {
    background: rgba(204,51,51,0.3);
    border-color: rgba(204,51,51,0.5);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(204,51,51,0.2);
  }

  .btn-primary {
    background: linear-gradient(90deg, var(--twl-red-accent), #ff4444);
    border: none;
    color: #ffffff;
    font-weight: 700;
    box-shadow: 0 4px 15px rgba(204,51,51,0.4);
  }
  .btn-primary:hover {
    background: linear-gradient(90deg, #ff4444, #ff6666);
    box-shadow: 0 6px 20px rgba(204,51,51,0.6);
  }

  .btn-secondary {
    background: rgba(26,26,26,0.8);
    border: 1px solid rgba(204,51,51,0.4);
    color: var(--text-primary);
  }
  .btn-secondary:hover {
    background: rgba(26,26,26,1);
    border-color: var(--twl-light-blue);
  }

  #twitch-user {
    color: var(--text-muted);
    font-size: 0.9rem;
    display: none;
  }

  /* Mobile responsive */
  @media (max-width: 768px) {
    nav#twl-header {
      padding: 0.75rem 1rem;
    }
    .header-container {
      flex-direction: column;
      gap: 0.75rem;
    }
    .auth-buttons {
      width: 100%;
      flex-direction: column;
    }
    .btn {
      width: 100%;
      text-align: center;
    }
  }
</style>

<nav id="twl-header">
  <div class="header-container">
    <div class="hamburger-menu">
      <button id="hamburger-btn" class="hamburger-btn" aria-label="Toggle team filter">☰</button>
      <div id="team-dropdown" class="team-dropdown">
        <div class="team-dropdown-header">
          <h3>Filter by Teams</h3>
          <button class="team-dropdown-close" onclick="closeTeamDropdown()">×</button>
        </div>
        <div id="team-checkbox-list">
          <!-- Team checkboxes will be inserted here -->
        </div>
        <div class="team-dropdown-actions">
          <button onclick="selectAllTeams()">Select All</button>
          <button onclick="deselectAllTeams()">Clear</button>
          <button class="primary" onclick="applyTeamFilter()">Apply</button>
        </div>
      </div>
    </div>
    <div class="header-brand">
      <a href="https://teamwarfare.net/" target="_blank" style="display: inline-block; text-decoration: none;">
        <img src="https://github.com/T24085/ProjectTribes/blob/main/TWL-TPL3.png?raw=true" alt="TWL Logo" onerror="this.style.display='none'">
      </a>
      <div>
        <h1 class="brand-title">TWL Stream Viewer</h1>
        <p class="brand-subtitle">Multi-Game Hub</p>
      </div>
    </div>
    <div class="auth-buttons">
      <span id="twitch-user"></span>
      <button id="chat-popup-btn" class="btn btn-secondary" style="display: none;">💬 Chat</button>
      <button id="twitch-login-btn" class="btn btn-primary">Sign in with Twitch</button>
      <button id="admin-panel-btn" class="btn btn-secondary hidden">Admin Panel</button>
      <button id="admin-signin-btn" class="btn btn-secondary hidden">Admin Sign In</button>
    </div>
  </div>
</nav>

<script>
  // This nav will be integrated with the main page's OAuth and admin logic
</script>
